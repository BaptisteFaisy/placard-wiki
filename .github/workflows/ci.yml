name: CI

# CI du dépôt Placard du wiki : types, tests vitest, limites de taille,
# cohérence du manifeste Forge, sanity docs, tests des gardes CI.
# Monorepo pnpm : un tsconfig racine, les tests vivent à côté du code
# (`packages/*/src/**/*.test.ts`). Le sous-module vendor/placard n'est PAS
# re-testé ici (il a sa propre CI) — il est seulement installé et typé.
# Le check publié s'appelle `ci` (nom du job) : exigé par le ruleset de
# `main` et par la file Mergify, avec `ci-budget` et `couche0`.
#
# Budget : règle user (5 minutes maximum par job). Les runners self-hosted
# n'ont pas Node sur le PATH par défaut : il est installé pour l'utilisateur
# du runner dans ~/.local/node.
on:
  pull_request:
  # File de merge : même contrôle sur le commit temporaire du groupe.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: [self-hosted, linux, x64, placard-wiki-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false
          # vendor/placard est public : le sous-module est cloné anonymement
          # à l'étape suivante, pas par checkout (persist-credentials: false).

      - name: Sous-module vendor/placard (épinglé, profondeur 1)
        shell: bash
        run: git submodule update --init --depth 1

      # Runners self-hosted persistants : un sous-dossier parasite d'un run
      # précédent peut survivre et fausser les contrôles. node_modules est
      # exclu (réinstallé si le verrou change) ; -f simple pour ne jamais
      # emporter le sous-module (dépôt niché).
      - name: Nettoyage du workspace
        shell: bash
        run: git clean -fdx -e node_modules

      # Le /tmp des runners est un tmpfs saturable : vitest y meurt en ENOSPC
      # alors que le disque a encore de la place. Les temporaires partent donc
      # sur le disque, dans le home du runner.
      - name: Temporaires sur le disque (jamais dans le tmpfs /tmp)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/ci-tmp"
          echo "TMPDIR=$HOME/.cache/ci-tmp" >> "$GITHUB_ENV"

      - name: Node du worker (hors PATH par défaut)
        shell: bash
        run: |
          set -euo pipefail
          NODE_BIN="$HOME/.local/node/bin"
          if [ ! -x "$NODE_BIN/node" ]; then
            echo "::error::Node introuvable dans $NODE_BIN (installation du worker absente)"
            exit 1
          fi
          echo "$NODE_BIN" >> "$GITHUB_PATH"
          "$NODE_BIN/node" --version

      # Dépendances : pnpm via corepack, store persistant du runner ;
      # réinstallation seulement si le verrou ou le sous-module change.
      - name: Dépendances (cache du runner, réinstallation si verrou changé)
        shell: bash
        run: |
          set -euo pipefail
          corepack enable --install-directory "$HOME/.local/node/bin" >/dev/null 2>&1 || true
          corepack prepare pnpm@9.15.9 --activate >/dev/null
          HASH="$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)-$(git -C vendor/placard rev-parse HEAD)"
          STAMP="node_modules/.ci-lock-hash"
          if [ -d node_modules ] && [ -f "$STAMP" ] && [ "$(cat "$STAMP")" = "$HASH" ]; then
            echo "cache node_modules à jour ($HASH) — pas de réinstallation"
          else
            pnpm install --frozen-lockfile --prefer-offline
            printf '%s' "$HASH" > "$STAMP"
          fi

      - name: Types (tsconfig racine)
        shell: bash
        run: pnpm typecheck

      - name: Tests des paquets
        shell: bash
        run: pnpm test

      # Règles de taille du dépôt (moins de 500 lignes par fichier, moins de
      # 50 lignes par fonction) et cohérence du manifeste Forge : deux gardes
      # déterministes, quelques secondes, aucun réseau.
      - name: Limites de taille et manifeste Forge
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_limits.py
          node tools/validate_manifest.mjs

      - name: Sanity docs (UTF-8, non vides)
        shell: bash
        run: |
          python3 - <<'EOF'
          import pathlib
          exts = {".md", ".mdx", ".txt"}
          vides, illisibles, total = [], [], 0
          for f in sorted(pathlib.Path(".").rglob("*")):
              posix = f.as_posix()
              if (".git/" in posix or "node_modules/" in posix
                      or posix.startswith("vendor/")
                      or f.suffix.lower() not in exts):
                  continue
              total += 1
              try:
                  contenu = f.read_text(encoding="utf-8")
              except (OSError, UnicodeError):
                  illisibles.append(posix)
                  continue
              if not contenu.strip():
                  vides.append(posix)
          print("%d doc(s) contrôle(s)" % total)
          for f in illisibles:
              print("::error::illisible en UTF-8 : %s" % f)
          for f in vides:
              print("::error::document vide : %s" % f)
          raise SystemExit(1 if (illisibles or vides) else 0)
          EOF

      # Les gardes de la CI se testent elles-mêmes : couche0, agents Hermes
      # (conflits, périmètre, jambe InferHub) et triage rouge — stdlib,
      # quelques secondes, aucun réseau, aucune clé.
      - name: Tests des gardes CI
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/hermes/sonde.py --selftest
          python3 .github/hermes/test_a2a.py
          python3 .github/hermes/test_compilation_gate.py
          python3 .github/hermes/test_conflict_agent.py
          python3 .github/hermes/test_provider.py
          python3 .github/hermes/test_quota.py
          python3 .github/hermes/test_scope_agent.py
          python3 .github/hermes/test_union_journal.py
          python3 tools/test_triage.py
          python3 .github/couche0/test_check_couche0.py
